<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f8a8a">
<meta name="description" content="MedScribe AI — ambient clinical scribe for Parasnath Speciality Clinic, by Revonix.Solution">
<title>MedScribe AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f7f8; --surface:#ffffff; --surface-2:#eef4f5; --text:#0f1f24; --muted:#5b6d72; --border:#dbe5e8;
  --accent:#0f8a8a; --accent-strong:#0b6f70; --accent-soft:#dff3f1; --accent-2:#2563eb; --on-accent:#ffffff;
  --danger:#dc2626; --danger-soft:#fde4e4; --warn:#a15c07; --warn-soft:#fdf1d2; --ok:#15803d; --ok-soft:#dcf5e3;
  --shadow:0 1px 2px rgba(15,31,36,.05),0 4px 14px rgba(15,31,36,.06); --shadow-lg:0 12px 40px rgba(15,31,36,.18);
  --radius:16px; --radius-sm:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1416; --surface:#111d20; --surface-2:#172629; --text:#e4eef0; --muted:#8fa3a8; --border:#22363a;
    --accent:#2cc4b4; --accent-strong:#5fd8ca; --accent-soft:#113533; --accent-2:#60a5fa; --on-accent:#04201d;
    --danger:#f87171; --danger-soft:#3a1717; --warn:#fbbf24; --warn-soft:#352709; --ok:#4ade80; --ok-soft:#0f2d1a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); --shadow-lg:0 12px 40px rgba(0,0,0,.55); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1416; --surface:#111d20; --surface-2:#172629; --text:#e4eef0; --muted:#8fa3a8; --border:#22363a;
  --accent:#2cc4b4; --accent-strong:#5fd8ca; --accent-soft:#113533; --accent-2:#60a5fa; --on-accent:#04201d;
  --danger:#f87171; --danger-soft:#3a1717; --warn:#fbbf24; --warn-soft:#352709; --ok:#4ade80; --ok-soft:#0f2d1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); --shadow-lg:0 12px 40px rgba(0,0,0,.55); color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
h1,h2,h3,h4,.display{font-family:'DM Sans','Inter',sans-serif;letter-spacing:-.015em;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{flex-shrink:0}
.hidden{display:none!important}

/* App bar */
.appbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:calc(env(safe-area-inset-top) + 8px) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left))}
.appbar-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:42px}
.appbar h1{font-size:18px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .sub{font-size:12px;color:var(--muted);font-weight:500;display:block;font-family:Inter,sans-serif;letter-spacing:0}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--text);transition:background .15s,transform .1s}
.icon-btn:active{transform:scale(.95)}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:#fff}

main#view{max-width:760px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));animation:fadeUp .28s ease}
main#view.no-nav{padding-bottom:calc(32px + env(safe-area-inset-bottom))}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 20px rgba(0,0,0,.04)}
.nav-inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;position:relative;transition:color .15s}
.nav button svg{width:22px;height:22px}
.nav button.active{color:var(--accent)}
.nav button.active::before{content:'';position:absolute;top:0;left:32%;right:32%;height:3px;border-radius:0 0 4px 4px;background:var(--accent)}

/* Cards & layout */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card + .card,.stack > * + *{margin-top:12px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 2px 10px}
.section-title h3{font-size:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.grid-3{gap:8px}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid transparent;padding:11px 16px;font-weight:600;font-size:15px;transition:transform .1s,background .15s,opacity .15s,box-shadow .15s;white-space:nowrap}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn-primary:hover:not(:disabled){background:var(--accent-strong)}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn-ghost:hover:not(:disabled){background:var(--surface-2)}
.btn-danger{background:var(--danger);color:#fff}
.btn-ok{background:var(--ok);color:#fff}
.btn-soft{background:var(--accent-soft);color:var(--accent-strong)}
.btn-block{width:100%}
.btn-lg{padding:15px 18px;font-size:16px;border-radius:14px}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:10px}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.badge-draft{background:var(--warn-soft);color:var(--warn)}
.badge-approved{background:var(--ok-soft);color:var(--ok)}
.badge-live{background:var(--danger);color:#fff}
.badge-mode-live{background:var(--ok-soft);color:var(--ok)}
.badge-mode-sim{background:var(--warn-soft);color:var(--warn)}
.badge-neutral{background:var(--surface-2);color:var(--muted)}

/* Forms */
.field{display:block;margin-bottom:14px}
.field > span{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--muted)}
.input,select.input,textarea.input{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--border);background:var(--surface);outline:none;transition:border .15s,box-shadow .15s;font-size:15px}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea.input{resize:vertical;min-height:70px;line-height:1.45}
.input:disabled,.input[readonly]{background:var(--surface-2)}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .input{padding-left:40px}

/* Segmented */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);transition:background .15s,color .15s}
.seg button.on{background:var(--surface);color:var(--accent-strong);box-shadow:var(--shadow)}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:10px;transition:background .15s}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface-2)}
.li .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .meta{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;flex-shrink:0;font-family:'DM Sans',sans-serif}
.avatar.lg{width:64px;height:64px;font-size:22px}
.chev{color:var(--muted)}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}

/* Stats */
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,border-color .15s;text-align:left}
.stat:hover{border-color:var(--accent)}
.stat:active{transform:scale(.98)}
.stat.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.stat .num{font-family:'DM Sans',sans-serif;font-size:28px;font-weight:700;line-height:1.1}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}

.hero{background:linear-gradient(135deg,var(--accent) 0%,color-mix(in srgb,var(--accent-2) 75%,var(--accent)) 100%);color:#fff;border-radius:20px;padding:20px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero h2{font-size:22px;margin-bottom:4px}
.hero p{opacity:.9;font-size:14px}
.hero .btn{background:#fff;color:#0b5f60;margin-top:16px;box-shadow:0 6px 18px rgba(0,0,0,.15)}

/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 24px);background:radial-gradient(circle at 20% 0%,var(--accent-soft),transparent 55%),radial-gradient(circle at 100% 100%,color-mix(in srgb,var(--accent-2) 14%,transparent),transparent 50%)}
.login-card{width:100%;max-width:400px;animation:fadeUp .35s ease}
.login-logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:#fff;margin:0 auto 14px;box-shadow:var(--shadow-lg)}

/* Recording */
.rec-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.live-dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.2s ease-in-out infinite}
.badge-live{box-shadow:0 0 0 0 rgba(220,38,38,.6);animation:ring 1.6s ease-out infinite}
@keyframes pulse{50%{opacity:.25}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(220,38,38,.55)}100%{box-shadow:0 0 0 12px rgba(220,38,38,0)}}
.wave{display:flex;align-items:center;justify-content:center;gap:4px;height:74px;margin:18px 0 6px}
.wave span{width:5px;border-radius:5px;background:linear-gradient(to top,var(--accent),var(--accent-2));height:12px;animation:wave 1.1s ease-in-out infinite}
.wave.paused span{animation-play-state:paused;opacity:.4}
@keyframes wave{0%,100%{height:10px}50%{height:var(--h,56px)}}
.timer{font-family:'DM Sans',sans-serif;font-size:44px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.transcript{max-height:46vh;min-height:180px;overflow-y:auto;background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:15px;scroll-behavior:smooth}
.transcript p{margin-bottom:8px}
.transcript .spk{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-right:6px;padding:1px 6px;border-radius:6px}
.spk.d{background:var(--accent-soft);color:var(--accent-strong)}
.spk.p{background:color-mix(in srgb,var(--accent-2) 16%,transparent);color:var(--accent-2)}
.interim{font-style:italic;color:var(--muted)}

/* Review */
.cp-sec{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 0;border-bottom:1px dashed var(--border)}
.cp-sec:last-child{border-bottom:0}
.cp-num{width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent-strong);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.cp-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.cp-val{white-space:pre-wrap;word-break:break-word}
.cp-empty{color:var(--muted);font-style:italic;font-size:14px}
.soap-sec{padding:14px 0;border-bottom:1px dashed var(--border)}
.soap-sec:last-child{border-bottom:0}
.soap-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.soap-letter{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'DM Sans',sans-serif;color:#fff}
.tbl-wrap{overflow-x:auto;margin-top:4px;border:1px solid var(--border);border-radius:10px}
table.meds{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
table.meds th{background:var(--surface-2);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px 10px}
table.meds td{padding:8px 10px;border-top:1px solid var(--border);vertical-align:top}
table.meds td input{width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:14px;min-width:70px}
.consent{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface-2);cursor:pointer}
.consent input{width:20px;height:20px;accent-color:var(--accent);margin-top:2px;flex-shrink:0}
.flag{font-size:12px;background:var(--warn-soft);color:var(--warn);padding:2px 7px;border-radius:6px;font-weight:600}
.sug{margin-top:2px;font-weight:500;line-height:1.5}
.notice{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;font-size:13px;background:var(--accent-soft);color:var(--accent-strong)}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 120px}

/* Audit */
.audit-item{display:flex;gap:12px;padding:12px 2px;border-bottom:1px solid var(--border)}
.audit-item:last-child{border-bottom:0}
.audit-ic{width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}

/* Settings */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}

/* Modal & toast */
.backdrop{position:fixed;inset:0;z-index:100;background:rgba(5,15,18,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease;padding:0}
@media (min-width:600px){.backdrop{align-items:center;padding:16px}}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lg);animation:slideUp .25s cubic-bezier(.2,.9,.3,1);max-height:92vh;overflow-y:auto}
@media (min-width:600px){.modal{border-radius:20px;padding-bottom:20px}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}}
.modal h3{font-size:19px;margin-bottom:8px}
.modal .actions{margin-top:18px}
.toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 12px);z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);animation:toastIn .25s ease;max-width:440px;pointer-events:auto}
.toast.ok{background:var(--ok);color:#fff}.toast.err{background:var(--danger);color:#fff}.toast.warn{background:#b45309;color:#fff}
.toast.out{opacity:0;transform:translateY(-8px);transition:.25s}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:10px auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--border)}
.chip .avatar{width:28px;height:28px;font-size:11px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="appbar hidden" id="appbar">
  <div class="appbar-inner">
    <button class="icon-btn hidden" id="backBtn" aria-label="Back" onclick="App.back()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="brand-mark" id="brandMark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 12h3l3-7 4 14 3-7h5"/></svg></div>
    <h1 id="appTitle">MedScribe AI<span class="sub">Parasnath Speciality Clinic</span></h1>
    <div id="appbarRight"></div>
  </div>
</header>
<main id="view"></main>
<nav class="nav hidden" id="nav">
  <div class="nav-inner">
    <button data-nav="dashboard" onclick="App.nav('dashboard')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>Dashboard</button>
    <button data-nav="patients" onclick="App.nav('patients')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14.6c2 .7 3.2 2.5 3.6 5.4"/></svg>Patients</button>
    <button data-nav="audit" onclick="App.nav('audit')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6M8 2.5h8v3H8z"/><path d="M6 4H5a1 1 0 00-1 1v15a1 1 0 001 1h14a1 1 0 001-1V5a1 1 0 00-1-1h-1"/><path d="M8 11h8M8 15h5"/></svg>Audit</button>
    <button data-nav="settings" onclick="App.nav('settings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Settings</button>
  </div>
</nav>
<div class="toasts" id="toasts" aria-live="polite"></div>
<noscript><p style="padding:20px">MedScribe AI needs JavaScript enabled. Please open this file in Google Chrome.</p></noscript>

<script>
'use strict';
/* =========================================================

function mergeClinicMeds(note, matches, fromAI = false) {
  if (!matches || !matches.length) return;
  for (const m of matches) {
    const key = m.name.replace(/^(Tab|Cap|Gel|Inj|Syp|Oint)\s+/i, '').split(/[\s+]/)[0].toLowerCase();
    const said = String(m.mentioned_as || '').toLowerCase();
    let med = note.medicines.find(x => { const n = x.name.toLowerCase(); return n.includes(key) || (said && n.includes(said)); });
    // The AI reads context (who prescribed, what was stopped), so for AI notes the clinic list
    // only enriches medicines the AI kept; it does not re-add ones the AI left out.
    if (!med && fromAI) continue;
    if (!med) { med = { name: m.name, frequency: '', timing: '', duration: '' }; note.medicines.push(med); }

  const matches = [...text.matchAll(MED_RE)].filter(m => {
    const nameRaw = m[2].trim(); const first = nameRaw.split(/[\s+]/)[0].toLowerCase();
    return !MED_STOP.has(first) && nameRaw.replace(/[^\p{L}]/gu, '').length >= 4;
  });
  matches.forEach((m, i) => {
    const nameRaw = m[2].trim();
    const prefix = medPrefix(m[1]);
    const strength = m[3] ? m[3] + (m[4] ? m[4].toLowerCase().replace(/एमजी|मिलीग्राम/, 'mg') : 'mg') : '';
    const end = m.index + m[0].length;
    const next = matches[i + 1] ? matches[i + 1].index : text.length;
    let ctx = text.slice(end, Math.min(next, end + 170)); ctx = ctx.split('\n')[0].toLowerCase();
    let freq = ''; for (const [re, v] of FREQ) if (re.test(ctx)) { freq = v; break; }
    let timing = ''; for (const [re, v] of TIMING) if (re.test(ctx)) { timing = v; break; }
    if (prefix === 'Inj' && !timing && /joint|ghutne mein|intra[- ]?articular|घुटने में/.test(ctx)) timing = 'Intra-articular';
    let duration = '';
    for (const d of ctx.matchAll(durRe())) {
      const after = ctx.slice(d.index + d[0].length, d.index + d[0].length + 12);
      if (/^\s*(ke\s+)?(baad|बाद|later|after)/.test(after)) continue;
      duration = durText(numOf(d[1]), unitOf(d[2])); break;
    }
    const name = `${prefix} ${/[a-z]/i.test(nameRaw) ? titleCase(nameRaw.replace(/\s*plus\s*/i, '+')) : nameRaw}${strength ? ' ' + strength : ''}`;
    if (out.some(o => o.name.toLowerCase() === name.toLowerCase())) return;
    out.push({ name, frequency: freq, timing, duration });
  });
  return out;
}

const PH = [
  [/diabetes|sugar|madhumeh|शुगर|डायबिटीज|मधुमेह/i, 'Diabetes mellitus', 'No diabetes'],
  [/\bbp\b|blood pressure|hypertension|बीपी|ब्लड प्रेशर/i, 'Hypertension', 'No hypertension'],
  [/thyroid|थायराइड/i, 'Thyroid disorder', 'No thyroid disorder'],
  [/asthma|\bdama\b|दमा/i, 'Asthma', 'No asthma'],
  [/operation|surgery|ऑपरेशन/i, 'Previous surgery', 'No previous surgery'],
  [/\bchot\b|injury|gir gay|gir gaya|giri thi|\bfall\b|fisal|चोट/i, 'History of trauma / fall', 'No history of trauma'],
];
const ADV = [
  [/quadriceps|quads/, 'Quadriceps strengthening exercises', 'ex'],
  [/pendulum/, 'Pendulum exercises', 'ex'],
  [/wall climb|finger ladder/, 'Wall-climbing (finger ladder) exercises', 'ex'],
  [/isometric/, 'Isometric strengthening exercises', 'ex'],
  [/physio|फिजियो/, 'Physiotherapy', 'ex'],
  [/exercise|kasrat|vyayam|व्यायाम|एक्सरसाइज/, 'Regular prescribed exercises', 'gen'],
  [/garam|sikai|hot fomentation|गरम|सिकाई|सेक/, 'Hot fomentation'],
  [/barf|ice pack|बर्फ/, 'Ice pack application'],
  [/seedhi|sidhi|stairs|सीढ़ी/, 'Avoid / minimise climbing stairs'],
  [/palthi|squat|zameen par|floor par|पालथी/, 'Avoid squatting & cross-legged sitting'],
  [/western toilet|commode/, 'Use western toilet'],
  [/vajan kam|weight (kam|loss|reduc)|वजन कम/, 'Weight reduction'],
  [/bhaari|heavy|vajan mat uth|vajan na uth|भारी/, 'Avoid lifting heavy weights'],
  [/belt/, 'Use lumbar support belt'],
  [/knee cap|knee brace/, 'Use knee cap / brace'],
  [/collar/, 'Use cervical collar'],
  [/takiya|pillow|तकिया/, 'Use a thin pillow'],
  [/posture/, 'Maintain correct posture'],
  [/break le|break lijiye|breaks/, 'Take regular breaks from desk / screen work'],
  [/aaram|\brest\b|आराम/, 'Adequate rest'],
];
const ADV_TEMPLATE = {
  knee: ['Quadriceps strengthening exercises', 'Hot fomentation', 'Avoid squatting & cross-legged sitting'],
  'low back': ['Avoid lifting heavy weights', 'Hot fomentation', 'Back strengthening exercises once pain settles'],
  shoulder: ['Pendulum exercises', 'Hot fomentation'],
  neck: ['Maintain correct posture', 'Use a thin pillow', 'Isometric neck exercises'],
};
const IMPERATIVE = /(iye|ijiye|ie|iyega)(?![a-z])|\bmat\b|avoid|\bkare(n|in)?\b|करें|कीजिए|िए(?![\p{L}])|मत|should|must|please|use kar/iu;

function extractNote(transcript, patient) {
  const text = String(transcript || '');
  const sents = sentencesOf(text);
  const stmts = sents.filter(s => !isQ(s));
  const low = text.toLowerCase();
  const note = {
    patientName: patient ? patient.name : '', ageGender: patient ? `${patient.age} / ${patient.gender}` : '',
    chiefComplaint: '', painDetails: '', pastHistory: '', examination: '', investigation: '', diagnosis: '',
    medicines: [], advice: '', adviceTemplated: false, followUpDate: '', followUpNote: '', fee: String(S.settings.fee),
  };
  if (!text.trim()) { note.chiefComplaint = patient ? patient.complaint : ''; return note; }

  // ---- Chief complaint & pain details
  let ccSent = stmts.find(s => partOf(s) && PAIN_WORD.test(s)) || stmts.find(s => partOf(s));
  const part = ccSent ? partOf(ccSent) : null;
  const side = ccSent ? sideOf(ccSent) : '';
  let duration = '';
  const isHist = s => PH.some(([re]) => re.test(s));
  const durCands = [...stmts.filter(s => PAIN_WORD.test(s) || partOf(s)), ...stmts.filter(s => !isHist(s))];
  for (const s of durCands) {
    const l = s.toLowerCase();
    for (const d of l.matchAll(durRe())) {
      const after = l.slice(d.index + d[0].length, d.index + d[0].length + 14);
      const before = l.slice(Math.max(0, d.index - 12), d.index);
      if (/^\s*(se\b|से|ho gay|hua|hue|tak se|since)/.test(after) || /(since|for|pichhle|पिछले)\s*$/.test(before)) { duration = durText(numOf(d[1]), unitOf(d[2])); break; }
    }
    if (duration) break;
  }
  const symText = stmts.join(' \n ').toLowerCase();
  const radiation = /(pair|leg|taang|पैर|टांग)[^.\n]{0,25}(tak|neeche|niche|jaata|jata|jaati|aata|फैल|जाता)|radiat/.test(symText);
  const radSide = radiation ? sideOf((stmts.find(s => /(pair|leg|taang|पैर)/i.test(s)) || '')) : '';
  const stiffness = /akdan|akda|akad|stiff|jakad|जकड़|अकड़/.test(symText);
  const overhead = /haath upar|upar nahi uth|overhead|arm up|हाथ ऊपर/.test(symText);
  if (part) {
    let cc;
    if (part.k === 'back') cc = 'Low back pain' + (radiation ? ` radiating to ${radSide ? radSide.toLowerCase() + ' ' : ''}leg` : '');
    else cc = `${side ? side + ' ' : ''}${part.label} pain`;
    if (stiffness && part.k !== 'back') cc += ' and stiffness';
    if (overhead) cc += ' with difficulty raising arm';
    if (duration) cc += ` since ${duration}`;
    note.chiefComplaint = cap(cc.trim());
  } else if (patient) note.chiefComplaint = patient.complaint;

  const pd = [];
  if (duration) pd.push(`Duration: ${duration}`);
  if (part) pd.push(`Site: ${side && part.k !== 'back' ? side + ' ' : ''}${part.label}`);
  if (radiation) pd.push(`Radiation: to ${radSide ? radSide.toLowerCase() + ' ' : ''}leg`);
  const sc = symText.match(/(\d{1,2})\s*(out of|mein se|\/)\s*10/); if (sc) pd.push(`Pain score: ${sc[1]}/10`);
  const agg = [];
  if (/seedhi|sidhi|stairs|सीढ़ी/.test(symText)) agg.push('climbing stairs');
  if (/baithne se uth|uthne mein|sitting to standing|उठने/.test(symText)) agg.push('rising from sitting');
  if (/der (tak )?baith|lambe samay|prolonged sitting|zyada der baith/.test(symText)) agg.push('prolonged sitting');
  if (/chalne|walking|चलने/.test(symText)) agg.push('walking');
  if (/let nahi|us taraf let|lying on/.test(symText)) agg.push('lying on affected side');
  if (agg.length) pd.push(`Aggravated by: ${agg.join(', ')}`);
  if (/subah[^.\n]{0,30}(akad|akda|stiff|jakad)|morning stiffness/.test(symText)) pd.push('Morning stiffness present');
  else if (stiffness) pd.push('Stiffness present');
  if (/raat (ko )?(dard|pain)|night pain|raat ko dard|raat[^.\n]{0,12}zyada/.test(symText) || /raat ko dard zyada/.test(low)) pd.push('Night pain');
  if (/jhunjhuni|sunn|numb|tingling|झुनझुनी|सुन्न/.test(symText)) pd.push('Tingling / numbness reported');
  if (/(sujan|swelling|सूजन)/.test(symText) && !/(sujan|swelling)[^.\n]{0,12}(nahi|no)/.test(symText)) pd.push('Swelling reported');
  if (/(bhaari|heavy)[^.\n]{0,40}(uthay|uthaa|lift)/.test(symText)) pd.push('Onset after lifting heavy weight');
  if (overhead) pd.push('Difficulty raising arm overhead');
  note.painDetails = pd.join('\n');

  // ---- Past history (with negation)
  const ph = [];
  for (const [re, pos, neg] of PH) {
    for (const s of stmts) {
      const l = s.toLowerCase(); const m = l.match(new RegExp(re.source, 'i'));
      if (!m) continue;
      if (/examination|x-?ray|mri|lag raha|common hai/.test(l)) continue;
      ph.push(negatedAfter(l, m.index + m[0].length, m.index) ? neg : pos); break;
    }
  }
  if (!ph.length && /koi (bimari|bimaari|problem) nahi|no (other )?(illness|comorbid)|कोई बीमारी नहीं/.test(low)) ph.push('No significant past history');
  note.pastHistory = uniq(ph).join('\n');

  // ---- Examination
  const ex = [];
  const STOPW = new Set(['mein', 'me', 'hai', 'aur', 'par', 'pe', 'ki', 'ka', 'ke', 'the', 'examination', 'on', 'there', 'is', 'bhi', 'check', 'karta', 'hoon', 'main', 'ok', 'theek']);
  for (const s of stmts) {
    const l = s.toLowerCase();
    const t = l.match(/((?:[a-z]+\s+){0,4})tenderness/);
    if (t) { const w = t[1].trim().split(/\s+/).filter(Boolean); while (w.length && STOPW.has(w[0])) w.shift(); ex.push(cap((w.join(' ') + ' tenderness').trim()) + (/dono taraf|both sides|bilateral/.test(l) && !/bilateral/.test(w.join(' ')) ? ' (bilateral)' : '')); }
    if (/crepitus|katkat|kat-kat/.test(l)) ex.push(/bilateral crepitus|crepitus[^.,]{0,15}(dono|both|bilateral)/.test(l) ? 'Bilateral crepitus' : 'Crepitus present');
    const sp = l.match(/(paraspinal|paravertebral|trapezius|muscle)?\s*spasm/); if (sp) ex.push(cap(((sp[1] || 'muscle') + ' spasm')));
    const slr = l.match(/slr[^.]{0,40}?(\d{2})\s*(degree|deg|°)/);
    if (slr) ex.push(`SLR positive at ${slr[1]}°${sideOf(l) && sideOf(l) !== 'Bilateral' ? ' (' + sideOf(l).toLowerCase() + ')' : ''}`);
    else if (/slr[^.]{0,15}(negative|normal)/.test(l)) ex.push('SLR negative');
    for (const r of l.matchAll(/(flexion|extension|abduction|adduction|external rotation|internal rotation)[^.,]{0,25}?(\d{2,3})\s*(degree|deg|°)/g)) ex.push(`${cap(r[1])} up to ${r[2]}°`);
    for (const r of l.matchAll(/(external rotation|internal rotation|rom|range of motion|neck movements?|movements?)[^.,]{0,18}?(kam|restricted|limited|painful|reduced)/g)) {
      const what = r[1] === 'rom' ? 'ROM' : cap(r[1]);
      ex.push(`${what} ${r[2] === 'painful' ? 'painful' : 'restricted'}`);
    }
    const df = l.match(/(varus|valgus|flexion)\s+deformity/); if (df) ex.push(cap(df[1]) + ' deformity');
    if (/painful arc/.test(l)) ex.push(/painful arc[^.,]{0,10}(nahi|no|absent)|no painful arc/.test(l) ? 'No painful arc' : 'Painful arc present');
    if (/power[^.,]{0,15}(normal|theek|5\/5)/.test(l)) ex.push('Motor power normal');
    if (/neuro(logical)? deficit[^.,]{0,10}(nahi|no|absent)|no neuro/.test(l)) ex.push('No neurological deficit');
    if (/reflex[^.,]{0,15}(normal|theek)/.test(l)) ex.push('Reflexes normal');
    if (/effusion/.test(l) && !/effusion[^.,]{0,12}(nahi|no)|no effusion/.test(l)) ex.push('Effusion present');
  }
  note.examination = uniq(ex).join('\n');

  // ---- Investigation
  const inv = [];
  const regionOf = s => { const p = partOf(s); if (!p) return ''; const sd = sideOf(s);
    if (p.k === 'back') return 'LS spine'; if (p.k === 'neck') return 'cervical spine'; return `${sd && sd !== 'Bilateral' ? sd.toLowerCase() + ' ' : sd === 'Bilateral' ? 'both ' : ''}${p.label}${sd === 'Bilateral' ? 's' : ''}`; };
  const ADVISED = /karwa|karva|karaiye|karvaiye|kara lijiye|karaa|करवा|कराइए|get (an? )?|advis|needed|chahiye/;
  for (const s of stmts) {
    const l = s.toLowerCase();
    if (/x[- ]?ray|xray|एक्स[- ]?रे|एक्सरे/.test(l) && !(/report ke saath|report lekar|report le ke/.test(l) && !ADVISED.test(l))) {
      const reg = regionOf(s) || (part ? (part.k === 'back' ? 'LS spine' : part.k === 'neck' ? 'cervical spine' : part.label) : '');
      if (ADVISED.test(l)) inv.push(`X-ray ${reg} — advised`.replace(/\s+/g, ' '));
      else {
        const f = []; const g = l.match(/grade\s*(\d|iv|iii|ii|i)\b/); if (g) f.push('KL Grade ' + g[1].toUpperCase());
        if (/joint space[^.,]{0,25}(kam|reduced|narrow)/.test(l)) f.push('reduced joint space');
        if (/osteophyte/.test(l)) f.push('osteophytes');
        inv.push(`X-ray ${reg} (reviewed): ${f.join(', ') || 'see report'}`.replace(/\s+/g, ' '));
      }
    }
    if (/\bmri\b|एमआरआई/.test(l)) {
      const reg = regionOf(s) || (part ? (part.k === 'back' ? 'LS spine' : part.k === 'neck' ? 'cervical spine' : part.label) : '');
      if (/report ke saath|report lekar|report le ke/.test(l) && !ADVISED.test(l)) continue;
      inv.push(ADVISED.test(l) ? `MRI ${reg} — advised` : `MRI ${reg} (reviewed)`);
    }
    const tests = []; const T = { cbc: 'CBC', esr: 'ESR', crp: 'CRP', 'uric acid': 'Serum uric acid', 'vitamin d': 'Vitamin D3', 'vit d': 'Vitamin D3', 'ra factor': 'RA factor', hba1c: 'HbA1c', 'rbs': 'RBS', 'calcium level': 'Serum calcium', 'thyroid profile': 'Thyroid profile' };
    for (const k in T) if (l.includes(k)) tests.push(T[k]);
    if (tests.length) inv.push(`Blood tests: ${uniq(tests).join(', ')}${ADVISED.test(l) ? ' — advised' : ''}`);
  }
  note.investigation = uniq(inv).join('\n');

  // ---- Diagnosis (only if spoken)
  const dx = [];
  const grade = (low.match(/grade\s*(\d|iv|iii|ii|i)\b/) || [])[1];
  const DX = [
    [/osteo ?arthritis|(?<![a-z])oa(?![a-z])|गठिया|ghisaav|ghisav/, () => `${side ? side + ' ' : ''}${part && part.k !== 'back' ? part.label : 'knee'} osteoarthritis${grade ? ` (KL Grade ${grade.toUpperCase()})` : ''}`],
    [/radiculopathy/, () => `${part && part.k === 'neck' ? 'Cervical' : 'Lumbar'} radiculopathy${radSide ? ` (${radSide.toLowerCase()})` : ''}`],
    [/sciatica/, () => 'Sciatica'],
    [/pivd|slip ?disc|disc (bulge|prolapse|herniation)/, () => 'PIVD (suspected)'],
    [/frozen shoulder|adhesive capsulitis/, () => `Adhesive capsulitis (frozen shoulder)${side && side !== 'Bilateral' ? ' — ' + side.toLowerCase() : ''}`],
    [/rotator cuff|supraspinatus/, () => 'Rotator cuff tendinopathy'],
    [/impingement/, () => 'Shoulder impingement'],
    [/spondylosis/, () => `${part && part.k === 'back' ? 'Lumbar' : 'Cervical'} spondylosis`],
    [/mechanical (neck|back) pain/, m => `Mechanical ${m[1]} pain`],
    [/tennis elbow|lateral epicondylitis/, () => 'Lateral epicondylitis (tennis elbow)'],
    [/plantar fasciitis/, () => 'Plantar fasciitis'],
    [/\bgout\b/, () => 'Gout'],
    [/sprain|\bmoch\b|मोच/, () => 'Sprain'],
    [/fracture/, () => 'Fracture (to be confirmed)'],
  ];
  for (const [re, fn] of DX) {
    for (const s of stmts) {
      const l = s.toLowerCase(); const m = l.match(re);
      if (!m) continue;
      if (negatedAfter(l, m.index + m[0].length, m.index)) continue;
      dx.push(fn(m)); break;
    }
  }
  note.diagnosis = uniq(dx).map(cap).join('\n');

  // ---- Medicines (strictly from transcript)
  note.medicines = extractMeds(text);

  // ---- Advice
  const adv = []; let specificEx = false;
  for (const s of stmts) {
    const l = s.toLowerCase();
    if (!IMPERATIVE.test(l)) continue;
    if (MED_RE.test(s)) { MED_RE.lastIndex = 0; continue; } MED_RE.lastIndex = 0;
    for (const [re, label, kind] of ADV) {
      if (!re.test(l)) continue;
      if (kind === 'gen' && specificEx) continue;
      if (kind === 'ex') specificEx = true;
      if (label === 'Avoid / minimise climbing stairs' && /seedhi chadhne mein\??$/.test(l)) continue;
      adv.push(label);
    }
  }
  if (adv.length) note.advice = uniq(adv).join('\n');
  else if (part && ADV_TEMPLATE[part.label]) { note.advice = ADV_TEMPLATE[part.label].join('\n'); note.adviceTemplated = true; }

  // ---- Follow-up
  let fu = null;
  for (const d of low.matchAll(durRe())) {
    const after = low.slice(d.index + d[0].length, d.index + d[0].length + 14);
    const before = low.slice(Math.max(0, d.index - 10), d.index);
    if (/^\s*(ke\s+)?(baad|बाद|later)/.test(after) || /(after|in)\s+$/.test(before) && /follow|review|come|aaiye/.test(low.slice(d.index - 40, d.index + 40))) fu = d;
  }
  if (fu) { const n = numOf(fu[1]), u = unitOf(fu[2]); note.followUpDate = isoDate(addDur(n, u)); note.followUpNote = `After ${durText(n, u)}`; }
  return note;
}

function soapOf(n) {
  const medLines = n.medicines.filter(m => m.name).map(m => `${m.name}${m.frequency ? ' — ' + m.frequency : ''}${m.timing ? ', ' + m.timing : ''}${m.duration ? ' × ' + m.duration : ''}${hasSuggest(m) ? ' [dose not confirmed]' : ''}`);
  const fu = n.followUpDate ? `Follow-up: ${fmtDate(n.followUpDate + 'T00:00')}${n.followUpNote ? ' (' + n.followUpNote + ')' : ''}` : '';
  const advised = n.investigation.split('\n').filter(x => /advised/.test(x));
  const reviewed = n.investigation.split('\n').filter(x => x && !/advised/.test(x));
  return {
    S: [n.chiefComplaint && 'CC: ' + n.chiefComplaint, n.painDetails, n.pastHistory && 'Past history: ' + n.pastHistory.replace(/\n/g, '; ')].filter(Boolean).join('\n'),
    O: [n.examination && 'O/E: ' + n.examination.replace(/\n/g, '; '), ...reviewed].filter(Boolean).join('\n'),
    A: n.diagnosis,
    P: [medLines.length ? 'Rx:\n' + medLines.map((l, i) => `  ${i + 1}. ${l}`).join('\n') : '', advised.length ? 'Investigations: ' + advised.join('; ') : '', n.advice && 'Advice: ' + n.advice.replace(/\n/g, '; '), fu].filter(Boolean).join('\n'),
  };
}

const txToText = arr => arr.map(([s, t]) => `${s}: ${t}`).join('\n');

/* ---------------- Seed data ---------------- */
function seed() {
  const ago = (days, mins = 0) => { const d = new Date(Date.now() - mins * 60000); d.setDate(d.getDate() - days); return d; };
  const todayAt = mins => { const sod = new Date(); sod.setHours(0, 1, 0, 0); return new Date(Math.max(sod.getTime(), Date.now() - mins * 60000)); };
  const mk = (name, age, gender, phone, complaint, regDays) => ({ id: uid('p'), name, age, gender, phone, complaint, registered: ago(regDays, 300) });
  S.patients = [
    mk('Ramesh Patil', 58, 'M', '98220 41736', 'Right knee pain since 2 weeks', 14),
    mk('Sunita Sharma', 45, 'F', '97650 18254', 'Lower back pain radiating to left leg since 2 weeks', 9),
    mk('Anil Deshmukh', 62, 'M', '90040 77312', 'Bilateral knee pain, difficulty climbing stairs', 30),
    mk('Priya Joshi', 35, 'F', '88790 52107', 'Neck pain and stiffness', 2),
    mk('Manoj Gupta', 50, 'M', '93230 66481', 'Right shoulder pain, restricted movement', 1),
  ];
  const [ram, sun, ani] = S.patients;
  const mkC = (p, tx, date, status, dur) => {
    const text = txToText(tx); const note = extractNote(text, p); note.fee = '500';
    const fuBase = new Date(date);
    if (note.followUpNote) { const m = note.followUpNote.match(/(\d+) (\w+?)s?$/); if (m) note.followUpDate = isoDate(addDur(+m[1], m[2], fuBase)); }
    return { id: uid('c'), patientId: p.id, date, durationSec: dur, mode: 'Simulation', lang: 'hi-IN', transcript: text, note, status, createdBy: 'Dr. Patil', approvedBy: status === 'approved' ? 'Dr. Patil' : '', approvedAt: status === 'approved' ? new Date(date.getTime() + 6 * 60000) : null };
  };
  S.consultations = [
    mkC(ani, SAMPLE_TX.anil, ago(3, 200), 'approved', 412),
    mkC(ram, SAMPLE_TX.ramesh, todayAt(130), 'approved', 386),
    mkC(sun, SAMPLE_TX.sunita, todayAt(40), 'draft', 351),
  ];
  const sys = { user: 'Reception', role: 'Receptionist' };
  const doc = { user: 'Dr. Patil', role: 'Doctor' };
  const ev = [];
  S.patients.forEach(p => ev.push(['register', `Registered ${p.name} (${p.age}/${p.gender})`, sys, p.registered]));
  S.consultations.forEach(c => {
    const p = getP(c.patientId);
    ev.push(['record', `Recorded consultation for ${p.name} (${mmss(c.durationSec)})`, doc, c.date]);
    ev.push(['generate', `AI draft generated for ${p.name} — ${c.note.medicines.length} medicines extracted`, doc, new Date(c.date.getTime() + 60000)]);
    if (c.status === 'approved') ev.push(['approve', `Approved note for ${p.name} (consent confirmed)`, doc, c.approvedAt]);
  });
  ev.sort((a, b) => a[3] - b[3]).forEach(([t, d, who, ts]) => audit(t, d, { user: who.user, role: who.role, ts }));
}

const ROOTS = ['dashboard', 'patients', 'audit', 'settings'];
function show(screen, params = {}, push = true) {
  if (push && S.screen !== 'login') S.history.push({ screen: S.screen, params: S.params });
  S.screen = screen; S.params = params; render(); window.scrollTo(0, 0);
}
App = window.App = {};
App.nav = screen => { if (S.rec) return; S.history = []; S.dashFilter = S.dashFilter; show(screen, {}, false); };
App.back = () => {
  if (S.screen === 'recording') return App.discardRecording();
  const h = S.history.pop();
  if (h) { S.screen = h.screen; S.params = h.params; render(); window.scrollTo(0, 0); } else App.nav('dashboard');
};

const TITLES = { dashboard: 'MedScribe AI', patients: 'Patients', select: 'Select Patient', recording: 'Recording', review: 'Review Note', patient: 'Patient Details', audit: 'Audit Log', settings: 'Settings' };
function render() {
  const sc = S.screen; const loggedIn = !!S.user && sc !== 'login';
  $('#appbar').classList.toggle('hidden', !loggedIn);
  $('#nav').classList.toggle('hidden', !loggedIn || sc === 'recording');

  view.innerHTML = (SCREENS[sc] || SCREENS.dashboard)();
  if (AFTER[sc]) AFTER[sc]();
}

function startLive() {

    start: 'Speech recognition could not start',
  };
  const steps = [];
  if (notChrome) steps.push('Use <b>Google Chrome</b>. Other browsers (Safari, Edge, Brave) do not support this live transcription properly.');
  if (isFile) steps.push('Don’t open the file directly. Double-click <b>“Start MedScribe.command”</b> in the medscribe-ai folder — it opens the app at <b>localhost</b>, where Chrome allows the microphone.');
  if (code === 'not-allowed' || code === 'start' || code === 'service-not-allowed') {

  }

}

  (async () => {
    await sleep(700);
    for (const [spk, text] of script) {
      const words = text.split(' ');
      for (let i = 1; i <= words.length; i++) {
        if (S.rec !== r || r.simToken !== token || !r.active) return;
        r.interim = { speaker: spk, text: words.slice(0, i).join(' ') }; renderTranscript();
        await sleep(55 + Math.random() * 55);

  const closeSpin = modal({ body: `<div style="text-align:center;padding:10px 0"><div class="spinner"></div><h3>Generating clinical note…</h3><p class="muted small">${r.audio ? `Transcribing the recording with ${sttName()}, then writing` : useNoteAI() ? 'Writing' : 'Extracting'} complaint, examination, diagnosis &amp; medicines${useNoteAI() ? ' with AI' : ''}</p>${isLocalAI() || (r.audio && S.backend.provider === 'local') ? '<p class="tiny muted">Running on this Mac, so this can take a minute or two.</p>' : ''}</div>`, dismissible: false });

  render();
};
App.addMed = () => { const c = curC(); c.note.medicines.push({ name: '', frequency: '', timing: '', duration: '' }); render(); const ins = document.querySelectorAll('[data-k="name"]'); ins[ins.length - 1]?.focus(); };
App.delMed = i => { const c = curC(); c.note.medicines.splice(i, 1); render(); };
App.confirmMed = i => {
  const c = curC(); const m = c && c.note.medicines[i]; if (!m || !hasSuggest(m)) return;
  if (!isDoctor()) return toast('Only a doctor can confirm a dose', 'err');
  const s = m.suggest;
  if (s.strength && !/\d/.test(m.name)) m.name += ' ' + s.strength;
  for (const f of MED_FIELDS) if (s[f] && !m[f]) m[f] = s[f];
  delete m.suggest;
  audit('edit', `${displayName(S.user)} confirmed clinic default dose for ${m.name} (${getP(c.patientId).name})`);
  toast('Dose confirmed', 'ok'); render();
};
App.dismissSuggest = i => {
  const c = curC(); const m = c && c.note.medicines[i]; if (!m) return;
  delete m.suggest; audit('edit', `Cleared suggested dose for ${m.name} (${getP(c.patientId).name})`); render();
};
App.regenerate = () => {
  const c = curC(); if (!c) return;
  confirmModal('Regenerate from transcript?', 'All case-paper fields will be re-extracted from the current transcript. Manual edits to the note will be replaced (fee is kept).', 'Regenerate', 'btn-primary', () => {
    const p = getP(c.patientId); const fee = c.note.fee; S.review.editing = false;
    const closeSpin = modal({ body: `<div style="text-align:center;padding:10px 0"><div class="spinner"></div><h3>Regenerating note…</h3>${isLocalAI() ? '<p class="tiny muted">Running on this Mac, so this can take a minute or two.</p>' : ''}</div>`, dismissible: false });
    checkBackend().then(() => buildDraft(c.transcript, p, c.lang, null)).then(d => {
      closeSpin();
      c.note = d.note; c.note.fee = fee; c.noteSource = d.source; c.aiError = d.aiError; c.aiDropped = d.dropped;
      if (d.aiError) audit('fallback', `AI note failed for ${p.name}: ${d.aiError}. Used rule-based extraction.`);
      audit('regenerate', `Regenerated draft for ${p.name} (${d.source}) — ${c.note.medicines.length} medicines`);
      toast(d.aiError ? 'AI unavailable — draft rebuilt with rule-based extraction' : 'Draft regenerated', d.aiError ? 'warn' : 'ok'); render();
    }).catch(e => { closeSpin(); toast('Could not regenerate: ' + e.message, 'warn'); });
  });
};
App.approve = () => {
  const c = curC(); if (!c) return;
  if (!$('#consent')?.checked) return toast('Please tick the review consent first', 'err');
  if (!isDoctor()) return toast('Only a doctor can approve notes', 'err');
  const pend = pendingSuggestions(c.note);
  if (pend) { if (S.review.editing) { S.review.editing = false; render(); } return toast(`${pend} medicine${pend > 1 ? 's have' : ' has'} a suggested dose that is not confirmed. Confirm or clear it first.`, 'err'); }
  if (S.review.editing) { c.note.medicines = c.note.medicines.filter(m => m.name.trim()); S.review.editing = false; audit('edit', `Edited note for ${getP(c.patientId).name}`); }
  c.status = 'approved'; c.approvedBy = displayName(S.user); c.approvedAt = new Date();
  audit('approve', `Approved note for ${getP(c.patientId).name} (consent confirmed)`);
  toast('Note approved ✓', 'ok'); render();
};
App.exportCSV = () => {
  const c = curC(); if (!c) return; const p = getP(c.patientId); const n = c.note; const s = soapOf(n);
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = [['MedScribe AI — Parasnath Speciality Clinic, Badlapur'], ['Status', c.status.toUpperCase()], ['Consultation date', fmtDT(c.date)], ['Approved by', c.approvedBy || '—'], [],
    ['Section', 'Value'], ['Patient Name', n.patientName], ['Age / Gender', n.ageGender], ['Phone', p.phone], ['Chief Complaint', n.chiefComplaint], ['Pain Details', n.painDetails], ['Past History', n.pastHistory],
    ['Examination', n.examination], ['Investigation', n.investigation], ['Diagnosis', n.diagnosis], ['Advice', n.advice],
    ['Follow-up', [n.followUpDate, n.followUpNote].filter(Boolean).join(' — ')], ['Fee (INR)', n.fee], [],
    ['Medicine', 'Frequency', 'Timing', 'Duration', 'Unconfirmed suggestion'], ...n.medicines.map(m => [m.name, m.frequency, m.timing, m.duration, hasSuggest(m) ? Object.entries(m.suggest).map(([k, v]) => k + ': ' + v).join('; ') + ' (NOT confirmed)' : '']), [],
    ['SOAP', ''], ['Subjective', s.S], ['Objective', s.O], ['Assessment', s.A], ['Plan', s.P], [], ['Transcript', c.transcript]];
  const csv = '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `medscribe_${p.name.replace(/\s+/g, '_')}_${isoDate(c.date)}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  audit('export', `Exported ${c.status} note for ${p.name} as CSV`);
  toast('CSV downloaded', 'ok');
};

/* Live binding of review inputs */
document.addEventListener('input', e => {
  const c = curC(); if (!c) return; const t = e.target;
  if (t.dataset.field) { if (t.dataset.field === 'transcript') c.transcript = t.value; else c.note[t.dataset.field] = t.value; }
  if (t.dataset.med !== undefined) {
    const m = c.note.medicines[+t.dataset.med]; m[t.dataset.k] = t.value;
    // Typing a value yourself replaces that field's suggestion.
    if (m.suggest) { delete m.suggest[t.dataset.k === 'name' ? 'strength' : t.dataset.k]; if (!hasSuggest(m)) delete m.suggest; }
  }
});
document.addEventListener('change', e => {
  const c = curC(); if (!c) return; const f = e.target.dataset.field;
  if (f === 'fee') audit('edit', `Fee set to ₹${c.note.fee} for ${getP(c.patientId).name}`);
  if (f === 'followUpDate') audit('edit', `Follow-up set to ${c.note.followUpDate ? fmtDate(c.note.followUpDate + 'T00:00') : 'none'} for ${getP(c.patientId).name}`);
  if (f === 'followUpDate' && S.review.format === 'soap') render();
});

/* ---- 7. Patient detail ---- */
SCREENS.patient = () => {
  const p = getP(S.params.pid); if (!p) return '<div class="empty">Patient not found.</div>';
  const cs = consultsOf(p.id);
  const last = cs[0];
  return `
  <div class="card" style="text-align:center;padding:22px 16px">
    <div style="display:flex;justify-content:center;margin-bottom:10px">${avatar(p.name, 'lg')}</div>
    <h2 style="font-size:22px">${esc(p.name)}</h2>
    <p class="muted">${p.age} yrs · ${({ M: 'Male', F: 'Female', O: 'Other' })[p.gender] || esc(p.gender)}${p.phone ? ' · ' + esc(p.phone) : ''}</p>
    <button class="btn btn-primary" style="margin-top:14px" onclick="App.startRecording('${p.id}')">🎙️ Start Consultation</button>
  </div>
  <div class="card">
    <div class="set-row"><span class="muted small">Presenting complaint</span><span style="text-align:right">${esc(p.complaint)}</span></div>
    <div class="set-row"><span class="muted small">Registered</span><span>${fmtDate(p.registered)}</span></div>
    <div class="set-row"><span class="muted small">Total visits</span><span>${cs.length}</span></div>
    <div class="set-row"><span class="muted small">Latest diagnosis</span><span style="text-align:right">${esc(last?.note.diagnosis.split('\n')[0] || '—')}</span></div>
    <div class="set-row"><span class="muted small">Next follow-up</span><span>${last?.note.followUpDate ? fmtDate(last.note.followUpDate + 'T00:00') : '—'}</span></div>
  </div>
  <div class="section-title"><h3>Consultation history</h3></div>
  <div class="card" style="padding:6px 12px">${cs.length ? `<div class="list">${cs.map(c => `
    <div class="li" onclick="App.openNote('${c.id}')"><div class="audit-ic">📋</div>
      <div class="grow"><div class="title">${esc((c.note.diagnosis || c.note.chiefComplaint || 'Consultation').split('\n')[0])}</div>
      <div class="meta">${relDay(c.date)} · ${c.note.medicines.length} medicine${c.note.medicines.length === 1 ? '' : 's'}</div></div>${statusBadge(c.status)}</div>`).join('')}</div>`
    : '<div class="empty">No consultations yet. Tap “Start Consultation” to record the first one.</div>'}</div>`;
};

/* ---- 8. Audit log ---- */
SCREENS.audit = () => {
  const types = ['all', ...Object.keys(AUDIT_LABEL).filter(t => S.audit.some(a => a.type === t))];
  const list = S.audit.filter(a => S.auditFilter === 'all' || a.type === S.auditFilter);
  return `
  <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:10px">
    <p class="small muted">${S.audit.length} events · newest first · immutable for this session</p>
    <select class="input" style="width:auto;padding:8px 12px" onchange="App.auditFilter(this.value)">${types.map(t => `<option value="${t}" ${S.auditFilter === t ? 'selected' : ''}>${t === 'all' ? 'All events' : AUDIT_ICON[t] + ' ' + AUDIT_LABEL[t]}</option>`).join('')}</select>
  </div>
  <div class="card" style="margin-top:12px;padding:4px 14px">${list.length ? list.map(a => `
    <div class="audit-item"><div class="audit-ic">${AUDIT_ICON[a.type] || '•'}</div>
      <div class="grow"><div style="font-weight:600;font-size:14px">${esc(AUDIT_LABEL[a.type] || a.type)}</div>
      <div class="small">${esc(a.detail)}</div>
      <div class="tiny muted">${esc(a.user)}${a.role ? ' · ' + esc(a.role) : ''} · ${fmtDT(a.ts)} · ${new Date(a.ts).toLocaleTimeString('en-IN', { second: '2-digit', minute: '2-digit', hour: '2-digit' })}</div></div></div>`).join('')
    : '<div class="empty">No events of this type.</div>'}</div>`;
};
App.auditFilter = v => { S.auditFilter = v; render(); };

/* ---- 9. Settings ---- */
SCREENS.settings = () => {
  const st = S.settings;
  return `
  <div class="section-title" style="margin-top:4px"><h3>Clinic</h3></div>
  <div class="card">
    <div class="set-row"><span class="muted small">Clinic</span><span style="text-align:right;font-weight:600">Parasnath Speciality Clinic</span></div>
    <div class="set-row"><span class="muted small">Location</span><span>Badlapur, Maharashtra</span></div>
    <div class="set-row"><span class="muted small">Speciality</span><span style="text-align:right">Orthopaedic &amp; Musculoskeletal</span></div>
    <div class="set-row"><span class="muted small">Signed in as</span><span>${esc(displayName(S.user))} · ${esc(S.user.role)}</span></div>
    <div class="set-row"><span class="muted small">Default fee (₹)</span><input class="input" type="number" min="0" step="50" style="width:110px;padding:8px 10px" value="${st.fee}" onchange="App.setSetting('fee', this.value)"></div>
  </div>
  <div class="section-title"><h3>Speech recognition</h3></div>
  <div class="card">
    <label class="field"><span>Recognition language</span>
      <select class="input" onchange="App.setSetting('lang', this.value)">${Object.entries(LANGS).map(([k, v]) => `<option value="${k}" ${st.lang === k ? 'selected' : ''}>${k} — ${v}</option>`).join('')}</select></label>
    <div class="set-row"><span class="muted small">Web Speech API</span><span>${SR_API ? '<span class="dot" style="background:var(--ok)"></span> Supported' : '<span class="dot" style="background:var(--warn)"></span> Not supported (simulation only)'}</span></div>
    <div class="set-row"><span class="muted small">Speech-to-text</span><span id="backendStatus" style="text-align:right"><span class="dot" style="background:var(--muted)"></span> Checking…</span></div>
    <div class="set-row"><span class="muted small">AI note writing</span><span id="noteAIStatus" style="text-align:right"><span class="dot" style="background:var(--muted)"></span> Checking…</span></div>
    <div class="set-row"><span class="muted small">Microphone</span><span id="micStatus"><span class="dot" style="background:var(--muted)"></span> Checking…</span></div>
    <button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="App.testMic()">🎤 Test microphone</button>
  </div>
  <div class="section-title"><h3>Preferences</h3></div>
  <div class="card">
    <div class="set-row"><span class="small">Default note format</span>
      <div class="seg"><button class="${st.defaultFormat === 'case' ? 'on' : ''}" onclick="App.setSetting('defaultFormat','case')">Case Paper</button><button class="${st.defaultFormat === 'soap' ? 'on' : ''}" onclick="App.setSetting('defaultFormat','soap')">SOAP</button></div></div>
    <div class="set-row"><span class="small">Demo simulation<br><span class="tiny muted">Scripted sample dialogue for training only — off for real consultations</span></span>
      <div class="seg"><button class="${!st.demoMode ? 'on' : ''}" onclick="App.setSetting('demoMode',false)">Off</button><button class="${st.demoMode ? 'on' : ''}" onclick="App.setSetting('demoMode',true)">On</button></div></div>
    <div class="set-row"><span class="small">Appearance</span>
      <div class="seg">${['auto', 'light', 'dark'].map(t => `<button class="${st.theme === t ? 'on' : ''}" onclick="App.setSetting('theme','${t}')">${cap(t)}</button>`).join('')}</div></div>
  </div>
  <div class="section-title"><h3>About</h3></div>
  <div class="card">
    <div class="set-row"><span class="muted small">App</span><span>MedScribe AI v${VERSION}</span></div>
    <div class="set-row"><span class="muted small">Developer</span><span>Revonix.Solution</span></div>
    <div class="set-row"><span class="muted small">Data storage</span><span style="text-align:right">In-memory only · cleared on refresh</span></div>
    <p class="tiny muted" style="margin-top:10px">AI drafts are assistive only. Medicines are taken solely from what is spoken; every note requires doctor review and consent before approval.</p>
  </div>
  <button class="btn btn-ghost btn-block btn-lg" style="margin-top:16px;color:var(--danger)" onclick="App.signOut()">Sign Out</button>`;
};
AFTER.settings = () => { refreshMicStatus(); refreshBackendStatus(); };
async function refreshBackendStatus() {
  const b = await checkBackend(); const el = $('#backendStatus'); if (!el) return;
  const [color, text] = !b.ok ? ['muted', 'Off: backend not running (browser speech only)']
    : useServerSTT() ? ['ok', `${sttName()} (${esc(b.model)})`]
    : ['warn', `Backend in demo mode (${esc(b.reason || b.provider)}); using browser speech`];
  el.innerHTML = `<span class="dot" style="background:var(--${color})"></span> ${text}`;
  const ne = $('#noteAIStatus'); if (!ne) return; const na = b.noteAI;
  const [nc, nt] = !b.ok ? ['muted', 'Off: backend not running (rule-based notes)']
    : na && na.enabled ? ['ok', `On (${esc(aiLabel(na))})`]
    : ['warn', `Off (${esc((na && na.reason) || 'not available')}); rule-based notes`];
  ne.innerHTML = `<span class="dot" style="background:var(--${nc})"></span> ${nt}`;
}
async function refreshMicStatus() {
  const el = $('#micStatus'); if (!el) return;
  const set = (color, text) => { if ($('#micStatus')) $('#micStatus').innerHTML = `<span class="dot" style="background:var(--${color})"></span> ${text}`; };
  if (!navigator.mediaDevices?.getUserMedia) return set('warn', 'Unavailable here');
  try {
    const st = await navigator.permissions.query({ name: 'microphone' });
    const map = { granted: ['ok', 'Permission granted'], denied: ['danger', 'Permission blocked'], prompt: ['warn', 'Will ask on first use'] };
    set(...(map[st.state] || ['muted', st.state]));
  } catch (_) { set('muted', 'Status unknown — tap Test'); }
}
App.testMic = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(t => t.stop());
    toast('Microphone is working ✓', 'ok');
  } catch (e) { toast('Microphone unavailable: ' + (e.name === 'NotAllowedError' ? 'permission denied' : e.message || e.name), 'err'); }
  refreshMicStatus();
};
App.setSetting = (k, v) => {
  const labels = { lang: 'Speech language', defaultFormat: 'Default note format', theme: 'Appearance', fee: 'Default fee', demoMode: 'Demo simulation' };
  if (k === 'fee') v = Math.max(0, parseInt(v, 10) || 0);
  S.settings[k] = v;
  if (k === 'theme') applyTheme();
  audit('settings', `${labels[k]} changed to ${k === 'defaultFormat' ? (v === 'case' ? 'Case Paper' : 'SOAP') : v}`);
  toast(`${labels[k]} updated`);
  render();
};
function applyTheme() {
  const t = S.settings.theme;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
}
App.signOut = () => {
  confirmModal('Sign out?', 'Patient data stays in this browser tab until you refresh or close it.', 'Sign Out', 'btn-danger', () => {
    audit('logout', `${displayName(S.user)} signed out`);
    stopRecordingEngines(); S.rec = null; S.user = null; S.history = []; S.screen = 'login'; render();
  });
};

/* ---------------- Boot ---------------- */
seed();
applyTheme();
render();
checkBackend();
window.addEventListener('beforeunload', e => { if (S.rec) { e.preventDefault(); e.returnValue = ''; } });
</script>
